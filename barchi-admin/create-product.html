<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product - Barchi Furniture Admin</title>
  <meta name="description" content="Add New Furniture Product to Category.">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Admin Application CSS -->
  <link rel="stylesheet" href="admin.css">

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- PWA Manifest & Theme Color -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

  <!-- ADMIN HEADER -->
  <header class="admin-header">
    <div class="header-container">
      <div class="brand-wrapper">
        <div>
          <div style="display:flex; align-items:center; gap:12px;"><img src="barchi-logo.png" alt="Barchi Logo" style="width:44px; height:44px; object-fit:contain; border-radius:8px;"><div><h1 class="brand-title" style="font-family: 'Outfit', sans-serif; letter-spacing: 0.05em; font-size: 1.4rem;">BARCHI <span style="color: var(--accent-primary);">FURNITURE</span></h1>
          <p class="brand-subtitle" style="margin:0;">LUXURY LIVING ADMIN CONTROL PANEL</p></div></div>
        </div>
      </div>
      <div>
        <a href="add-products.html" class="btn btn-secondary btn-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to Products List
        </a>
      </div>
    </div>
  </header>

  <!-- ADMIN NAVIGATION TABS -->
  <nav class="admin-nav-bar">
    <div class="nav-container">
      <a href="index.html" class="admin-nav-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span class="nav-text-desktop">Dashboard</span>
        <span class="nav-text-mobile">Dash</span>
      </a>
      <a href="categories.html" class="admin-nav-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span class="nav-text-desktop">Categories</span>
        <span class="nav-text-mobile">Cate</span>
      </a>
      <a href="orders.html" class="admin-nav-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
        <span class="nav-text-desktop">Orders</span>
        <span class="nav-text-mobile">Ordr</span>
      </a>
      <a href="add-products.html" class="admin-nav-btn active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span class="nav-text-desktop">Add Products</span>
        <span class="nav-text-mobile">Prods</span>
      </a>
    </div>
  </nav>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="admin-main">
    <div class="admin-card" id="productFormCard" style="max-width: 840px; margin: 0 auto;">
      <div class="admin-card-header">
        <h2 class="admin-card-title" id="productFormHeader">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add New Furniture Product
        </h2>
      </div>
      <form id="standaloneProductForm">
        <div class="form-grid">
          <div class="form-group full-width">
            <label class="form-label" for="prodCategorySelect">Target Category</label>
            <select id="prodCategorySelect" class="form-control" required>
              <!-- Dynamically populated with category options -->
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="prodName">Product Name</label>
            <input type="text" id="prodName" class="form-control" placeholder="e.g. Chesterfield Velvet 3-Seater Sofa" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="prodPrice">Price (₹)</label>
            <input type="number" id="prodPrice" class="form-control" placeholder="48999" min="0" required />
          </div>

          <div class="form-group full-width">
            <label class="form-label" for="prodDescription">Product Description</label>
            <textarea id="prodDescription" class="form-control" placeholder="Enter product highlights, craft details, cushioning, and finish..."></textarea>
          </div>

          <!-- SPECIFICATIONS & DIMENSIONS SECTION -->
          <div class="form-group full-width" style="margin-top: 10px; padding-top: 16px; border-top: 1px dashed var(--border-color);">
            <h3 style="font-size: 1rem; font-weight: 700; color: var(--accent-primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg>
              Specifications & Dimensions
            </h3>
          </div>

          <div class="form-group">
            <label class="form-label" for="prodMaterial">Material</label>
            <input type="text" id="prodMaterial" class="form-control" placeholder="e.g. 100% Solid Teak Wood & Belgian Velvet" />
          </div>

          <div class="form-group">
            <label class="form-label" for="prodColour">Colour</label>
            <input type="text" id="prodColour" class="form-control" placeholder="e.g. Royal Blue / Teak Natural Honey" />
          </div>

          <div class="form-group">
            <label class="form-label" for="prodLength">Length</label>
            <input type="text" id="prodLength" class="form-control" placeholder="e.g. 78 inches (198 cm)" />
          </div>

          <div class="form-group">
            <label class="form-label" for="prodWidth">Width</label>
            <input type="text" id="prodWidth" class="form-control" placeholder="e.g. 36 inches (91 cm)" />
          </div>

          <div class="form-group full-width">
            <label class="form-label" for="prodHeight">Height</label>
            <input type="text" id="prodHeight" class="form-control" placeholder="e.g. 34 inches (86 cm)" />
          </div>

          <!-- MULTIPLE PRODUCT IMAGES UPLOAD (AUTO COMPRESSED TO <200KB) -->
          <div class="form-group full-width" style="margin-top: 10px; padding-top: 16px; border-top: 1px dashed var(--border-color);">
            <label class="form-label" for="prodImageFile">Product Images (Select Multiple at Once - Auto Compressed &lt; 200KB)</label>
            <input type="file" id="prodImageFile" class="form-control" accept="image/*" multiple />
            <div id="prodImagePreviewContainer" style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px;">
              <!-- Dynamically rendered multiple image thumbnails -->
            </div>
          </div>
        </div>

        <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px;">
          <a href="add-products.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary" id="prodFormSubmitBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save Product
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Load Admin Application Logic -->
  <script src="admin.js"></script>

</body>
</html>
