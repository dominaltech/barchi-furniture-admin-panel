  <!-- Load Admin Application Logic -->

  <!-- Ehsan-Architecture Standalone Push Notification Engine -->
  <script>
    const VAPID_PUBLIC_KEY = 'BLRlIrTI65YeYRK_UbJyEbtYpz6b6zLFs5NNG9-VzFT3CYQ2D_hmm8RQ0qf9UsTBEfXjNnw2FSqkaZnI7IX6wuM';

    function urlB64ToUint8(b64) {
      const pad = '='.repeat((4 - b64.length % 4) % 4);
      const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
      return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
    }

    let swReg = null;
    let pushSub = null;

    async function getActiveSWRegistration() {
      if (!('serviceWorker' in navigator)) return null;
      try {
        await navigator.serviceWorker.register('/sw.js', { scope: '/' });
        const reg = await navigator.serviceWorker.ready;
        return reg;
      } catch (e) {
        console.error('ServiceWorker registration error:', e);
        return null;
      }
    }

    async function registerSW() {
      swReg = await getActiveSWRegistration();
      if (!swReg) {
        updatePushUI('error');
        return;
      }
      await checkPushState();
    }

    async function checkPushState() {
      if (!('PushManager' in window)) { updatePushUI('unsupported'); return; }
      if (Notification.permission === 'denied') { updatePushUI('denied'); return; }
      if (!swReg) swReg = await getActiveSWRegistration();
      if (!swReg) { updatePushUI('idle'); return; }

      try {
        pushSub = await swReg.pushManager.getSubscription();
      } catch (e) {
        pushSub = null;
      }
      updatePushUI(pushSub ? 'subscribed' : 'idle');
    }

    async function togglePushSubscription() {
      swReg = await getActiveSWRegistration();
      if (!swReg) {
        alert('Service Worker is initializing. Please try again in 2 seconds.');
        return;
      }

      if (pushSub) {
        try {
          await pushSub.unsubscribe();
        } catch(e) {}
        pushSub = null;
        localStorage.removeItem('barchi_push_sub');
        updatePushUI('idle');
        alert('Notifications disabled.');
        return;
      }

      let perm = Notification.permission;
      if (perm !== 'granted') {
        perm = await Notification.requestPermission();
      }

      if (perm !== 'granted') {
        updatePushUI('denied');
        alert('Notification permission was denied. Enable notifications in Chrome settings.');
        return;
      }

      try {
        pushSub = await swReg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlB64ToUint8(VAPID_PUBLIC_KEY)
        });
        const subJSON = pushSub.toJSON();
        localStorage.setItem('barchi_push_sub', JSON.stringify(subJSON));

        try {
          await fetch('/api/save-subscription', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ subscription: subJSON })
          });
        } catch (e) {}

        if (window._supabaseClient) {
          try {
            await window._supabaseClient.from('push_subscriptions').delete().gte('id', 0);
            await window._supabaseClient.from('push_subscriptions').insert({
              endpoint: subJSON.endpoint,
              p256dh: subJSON.keys.p256dh,
              auth: subJSON.keys.auth,
              updated_at: new Date().toISOString()
            });
          } catch(e) {}
        }

        updatePushUI('subscribed');
        alert('🔔 Notifications Active! You will receive order alerts on your device even when closed.');
      } catch (err) {
        console.error('Subscribe error:', err);
        alert('Subscribe failed: ' + err.message);
        updatePushUI('idle');
      }
    }

    function getSubJSON() {
      if (pushSub) return (typeof pushSub.toJSON === 'function') ? pushSub.toJSON() : pushSub;
      const s = localStorage.getItem('barchi_push_sub');
      return s ? JSON.parse(s) : null;
    }

    async function sendTestPush() {
      const sub = getSubJSON();
      if (!sub) {
        alert('Please click "Enable Notifications" first!');
        return;
      }

      if (!sub?.keys?.p256dh || !sub?.keys?.auth) {
        alert('Subscription keys missing — please click "Enable Notifications" again.');
        return;
      }

      try {
        const res = await fetch('/api/send-push', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subscription: sub,
            title: '🛒 Barchi Admin — Test Push',
            message: 'Push notifications are ACTIVE! You will be notified on new orders.',
            url: '/orders.html'
          })
        });
        const data = await res.json();
        if (data && data.success) {
          alert('✅ Test push notification sent! Check your notification center.');
        } else {
          const errMsg = data.detail || data.error || 'Server error';
          alert('❌ Push result: ' + errMsg);
        }
      } catch (err) {
        alert('❌ Error: ' + err.message);
      }
    }

    function updatePushUI(state) {
      const btn = document.getElementById('pushSubscribeBtn');
      if (!btn) return;

      if (state === 'subscribed') {
        btn.style.background = '#10b981';
        btn.style.color = '#ffffff';
        btn.innerHTML = `Notifications Active 🟢`;
      } else if (state === 'denied') {
        btn.style.background = '#ef4444';
        btn.style.color = '#ffffff';
        btn.innerHTML = `Notifications Blocked`;
      } else if (state === 'unsupported') {
        btn.style.background = '#94a3b8';
        btn.style.color = '#ffffff';
        btn.innerHTML = `Not Supported`;
        btn.disabled = true;
      } else {
        btn.style.background = 'var(--accent-primary, #2563eb)';
        btn.style.color = '#ffffff';
        btn.innerHTML = `Enable Notifications`;
      }
    }

    window.addEventListener('load', registerSW);
  </script>
